services:
  postgres:
    image: postgres:16
    container_name: pgguard-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_only
      POSTGRES_DB: corpdb
    ports:
      - "5432:5432"
    volumes:
      - pgguard_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d corpdb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  vault:
    image: hashicorp/vault:1.15
    container_name: pgguard-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "8200:8200"
    volumes:
      - ./docker/vault:/vault/scripts:ro
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    # Dev mode server (insecure — local demo only)
    command: server -dev -dev-root-token-id=dev-root-token -dev-listen-address=0.0.0.0:8200

  vault-init:
    image: hashicorp/vault:1.15
    container_name: pgguard-vault-init
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-root-token
    volumes:
      - ./docker/vault:/vault/scripts:ro
    entrypoint: ["/bin/sh", "/vault/scripts/init.sh"]
    restart: "no"

volumes:
  pgguard_pgdata:
