# PgGuard RBAC policy — role selected via PGGUARD_ROLE
version: 1

# Propagate end-user JWT → Postgres session GUCs for RLS.
# Does NOT unlock SET ROLE in user SQL (still blocked). PgGuard applies set_config only.
principal_propagation:
  enabled: true
  jwt_secret_env: PGGUARD_JWT_SECRET
  # Fail closed: tokens must be HS256-verified with PGGUARD_JWT_SECRET. Local dev only:
  # PGGUARD_DEV_INSECURE_JWT=1 allows decode-only tokens and calls without a token.
  require_jwt: true
  claim_sub: sub
  claim_email: email
  session_gucs:
    sub: app.user_id
    email: app.user_email
  # Hex key shared with pgguard.current_user_id() (docker/postgres/optional/rls-principal-verify.sql).
  # When set, PgGuard also sets app.user_id_mac so RLS can reject a rewritten app.user_id.
  rls_hmac_key_env: PGGUARD_RLS_HMAC_KEY

# Phase 4: out-of-band approvals. Real (non-dry-run) run_dml / run_ddl calls need an
# Ed25519-signed token minted by a human with `npm run approvals -- approve <id>`.
# The server holds only the public key; tokens are single-use, expire, and are bound
# to the exact SQL text (sha256), tool, role, DB user, database and JWT sub.
# Fails closed: if approvals are required and no public key is configured, real runs
# are refused. dry_run never needs an approval.
approvals:
  required_for: [dml, ddl]
  public_key_env: PGGUARD_APPROVAL_PUBLIC_KEY   # PEM text, or PGGUARD_APPROVAL_PUBLIC_KEY_FILE=<path>
  max_ttl_seconds: 900
  clock_skew_seconds: 30
  ledger: file          # or postgres (apply docker/postgres/optional/approval-ledger.sql)
  # dir: data/approvals # request queue + file ledger (default; PGGUARD_APPROVALS_DIR overrides)

defaults:
  max_rows: 100
  # run_dml: statements touching more rows than this are rolled back; dry_run reports the count.
  max_affected_rows: 100
  require_confirm_dml: true
  require_confirm_ddl: true
  allow_explain_analyze: false
  audit_retention_days: 90
  # Read tools (db_health, list_*, describe_table, run_select, explain_query) run
  # inside BEGIN READ ONLY ... ROLLBACK with these transaction-local timeouts.
  # Values are milliseconds; 0 disables. Roles may override any of them.
  statement_timeout_ms: 15000
  lock_timeout_ms: 2000
  idle_in_transaction_session_timeout_ms: 30000
  # Phase 3 result caps for run_select / explain_query (compact JSON bytes).
  # Rows are read through a server-side cursor (FETCH max_rows+1), so the cap
  # holds even with LIMIT in a subquery; responses report truncated: true.
  max_result_bytes: 1048576
  max_cell_bytes: 65536
  # Schemas agent SQL may reference (early deny + filtered list_schemas/list_tables).
  # DB grants stay the guarantee. Roles may override; search_path (set per
  # transaction) defaults to this list and must be a subset of it.
  allowed_schemas:
    - corp

blocked_patterns:
  - multiple_statements
  - copy
  - into_outfile
  - set_role
  - set_session_authorization
  - create_user
  - alter_user
  - drop_user
  - grant
  - revoke
  - dangerous_functions

dangerous_functions:
  - pg_read_file
  - pg_write_file
  - pg_ls_dir
  - lo_import
  - lo_export
  - dblink
  - dblink_exec

roles:
  reader:
    description: Read-only analyst / agent
    db_user: app_reader
    allow:
      - health
      - introspect
      - select
      - explain
      - audit_read
      - whoami
    deny:
      - dml
      - ddl
    max_rows: 100
    allow_explain_analyze: false
    allowed_schemas: [corp]
    max_result_bytes: 524288

  writer:
    description: Application writer — DML with confirmation
    db_user: app_writer
    allow:
      - health
      - introspect
      - select
      - dml
      - explain
      - audit_read
      - whoami
    deny:
      - ddl
    max_rows: 200
    max_affected_rows: 50
    require_confirm_dml: true
    allow_explain_analyze: false
    allowed_schemas: [corp]

  migrator:
    description: Schema migrator — DDL with dual-control confirmation
    db_user: app_migrator
    allow:
      - health
      - introspect
      - select
      - dml
      - ddl
      - explain
      - audit_read
      - whoami
    deny: []
    max_rows: 500
    max_affected_rows: 1000
    require_confirm_dml: true
    require_confirm_ddl: true
    allow_explain_analyze: true
    dual_control_ddl: true

  admin:
    description: Break-glass admin (still audited; confirm required)
    db_user: app_migrator
    allow:
      - health
      - introspect
      - select
      - dml
      - ddl
      - explain
      - audit_read
      - whoami
    deny: []
    max_rows: 1000
    max_affected_rows: 10000
    require_confirm_dml: true
    require_confirm_ddl: true
    allow_explain_analyze: true
    dual_control_ddl: true
